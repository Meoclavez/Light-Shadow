<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIGHT & SHADOW — Sign In</title>
  <meta name="description" content="Sign in to LIGHT & SHADOW, a top-down puzzle-stealth heist game where light and shadow are dynamic physical paths and walls.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <script src="auth.js"></script>
</head>
<body class="login-body page-enter">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <button id="btn-ui-sound" class="icon-btn ui-sound" title="Toggle sound effects">🔊</button>

  <main class="login-shell">
    <section class="login-card" id="login-card">
      <header class="login-brand">
        <div class="login-logo">✨</div>
        <h1 class="login-title"><span class="t-light">LIGHT</span> <span class="t-amp">&amp;</span> <span class="t-shadow">SHADOW</span></h1>
        <p class="login-tagline">TWO SOULS. ONE HEIST.</p>
      </header>

      <div id="continue-panel" class="continue-panel hidden">
        <p>Signed in as <strong id="continue-name"></strong></p>
        <div class="continue-actions">
          <button id="btn-continue" class="btn primary">Continue Heist ➔</button>
          <button id="btn-switch" class="btn secondary">Switch Account</button>
        </div>
      </div>

      <div id="auth-panel">
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" data-mode="login" role="tab" aria-selected="true">Sign In</button>
          <button class="auth-tab" data-mode="register" role="tab" aria-selected="false">Create Account</button>
          <span class="tab-indicator" aria-hidden="true"></span>
        </div>

        <form id="auth-form" class="auth-form" novalidate>
          <label class="field">
            <span class="field-label">Username</span>
            <input id="username" name="username" type="text" autocomplete="username" maxlength="16" spellcheck="false" placeholder="e.g. nightfox" required>
          </label>
          <label class="field">
            <span class="field-label">Password</span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••" required>
          </label>
          <label class="field confirm-field hidden">
            <span class="field-label">Confirm password</span>
            <input id="password2" name="password2" type="password" autocomplete="new-password" placeholder="••••••">
          </label>
          <label class="remember">
            <input id="remember" type="checkbox" checked>
            <span>Stay signed in on this device</span>
          </label>
          <p id="auth-error" class="auth-error" role="alert" aria-live="assertive"></p>
          <button id="btn-submit" type="submit" class="btn primary submit-btn">Enter the Heist ➔</button>
        </form>
      </div>

      <div id="accounts-section" class="accounts-section hidden">
        <h2>Players on this device</h2>
        <ul id="account-list" class="account-list"></ul>
      </div>

      <p class="login-note">Accounts and progress are saved only in this browser. Don't reuse a real password.</p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
